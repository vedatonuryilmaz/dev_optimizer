<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Improvement report</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f8f9fb;
  --surface: #ffffff;
  --surface-low: #f3f5f8;
  --border: #e3e7ee;
  --border-strong: #c8d0dc;
  --text: #16191f;
  --muted: #5f6672;
  --faint: #8b93a1;
  --elephant: #1b6ef3;
  --elephant-soft: rgba(27, 110, 243, .12);
  --goldfish: #e86e00;
  --goldfish-soft: rgba(232, 110, 0, .13);
  --pass: #16803c;
  --pass-soft: rgba(22, 128, 60, .12);
  --promising: #0b63ce;
  --promising-soft: rgba(11, 99, 206, .12);
  --warn: #b45309;
  --warn-soft: rgba(180, 83, 9, .13);
  --fail: #dc2626;
  --fail-soft: rgba(220, 38, 38, .12);
  --neutral: #525b69;
  --neutral-soft: rgba(82, 91, 105, .11);
  --grid: #eaeef4;
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0e12;
    --surface: #14171e;
    --surface-low: #1b1f28;
    --border: #262b36;
    --border-strong: #3a4252;
    --text: #eceff4;
    --muted: #949dab;
    --faint: #687182;
    --elephant: #7cacf8;
    --elephant-soft: rgba(124, 172, 248, .15);
    --goldfish: #ff8d41;
    --goldfish-soft: rgba(255, 141, 65, .16);
    --pass: #3fb950;
    --pass-soft: rgba(63, 185, 80, .16);
    --promising: #58a6ff;
    --promising-soft: rgba(88, 166, 255, .16);
    --warn: #e39b27;
    --warn-soft: rgba(227, 155, 39, .17);
    --fail: #f85149;
    --fail-soft: rgba(248, 81, 73, .16);
    --neutral: #949dab;
    --neutral-soft: rgba(148, 157, 171, .14);
    --grid: #202530;
  }
}
* { box-sizing: border-box; }
body {
  max-width: 1120px;
  margin: 0 auto;
  padding: 1.6rem 1.5rem 3.5rem;
  background: var(--bg);
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

/* Pure-CSS Tab Shell */
.view-radio { position: absolute; opacity: 0; pointer-events: none; }
.topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: .8rem 1.2rem;
  padding-bottom: 1.1rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.5rem;
}
.brand {
  display: flex;
  align-items: center;
  gap: .65rem;
}
.brand-title {
  font-size: 1.05rem;
  font-weight: 650;
  letter-spacing: -.02em;
}
.tab-nav {
  display: inline-flex;
  background: var(--surface-low);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.tab-label {
  cursor: pointer;
  padding: .34rem .9rem;
  border-radius: 999px;
  font-size: .82rem;
  font-weight: 600;
  color: var(--muted);
  user-select: none;
  transition: background .12s ease, color .12s ease;
}
.tab-label:hover { color: var(--text); }
#tab-overview:checked ~ .topbar label[for="tab-overview"],
#tab-flow:checked ~ .topbar label[for="tab-flow"],
#tab-audit:checked ~ .topbar label[for="tab-audit"] {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
}
.view-panel { display: none; }
#tab-overview:checked ~ main .panel-overview,
#tab-flow:checked ~ main .panel-flow,
#tab-audit:checked ~ main .panel-audit {
  display: block;
}

/* Status Pill */
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  padding: .24rem .68rem;
  border-radius: 999px;
  font-size: .74rem;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  background: var(--neutral-soft);
  color: var(--neutral);
}
.status-chip::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 999px;
  background: currentColor;
}
.status-chip.tone-pass { color: var(--pass); background: var(--pass-soft); }
.status-chip.tone-promising { color: var(--promising); background: var(--promising-soft); }
.status-chip.tone-warn { color: var(--warn); background: var(--warn-soft); }
.status-chip.tone-fail { color: var(--fail); background: var(--fail-soft); }

/* Scoreboard Hero (Typography & Numbers, Not Boxes!) */
.scoreboard {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 1.25rem 2rem;
  margin-bottom: 1.4rem;
}
.score-main { flex: 1 1 460px; min-width: 0; }
.goal-kicker {
  font-size: .86rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 68ch;
  margin-bottom: .35rem;
}
.big-metric {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: .5rem .7rem;
  line-height: 1.05;
}
.metric-old {
  font-size: clamp(1.85rem, 3.2vw, 2.55rem);
  font-weight: 500;
  color: var(--muted);
  letter-spacing: -.03em;
}
.metric-arrow {
  font-size: clamp(1.5rem, 2.5vw, 2.1rem);
  color: var(--faint);
  font-weight: 400;
}
.metric-new {
  font-size: clamp(2.35rem, 4.4vw, 3.45rem);
  font-weight: 750;
  letter-spacing: -.035em;
}
.metric-new.tone-pass { color: var(--pass); }
.metric-new.tone-promising { color: var(--promising); }
.metric-new.tone-warn { color: var(--warn); }
.metric-new.tone-fail { color: var(--fail); }
.metric-unit {
  font-size: 1rem;
  font-weight: 500;
  color: var(--muted);
}
.delta-pill {
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  padding: .24rem .62rem;
  border-radius: 8px;
  font-size: .86rem;
  font-weight: 650;
  background: var(--surface-low);
  color: var(--text);
  vertical-align: middle;
}
.delta-pill.tone-pass { color: var(--pass); background: var(--pass-soft); }
.delta-pill.tone-promising { color: var(--promising); background: var(--promising-soft); }
.delta-pill.tone-warn { color: var(--warn); background: var(--warn-soft); }
.delta-pill.tone-fail { color: var(--fail); background: var(--fail-soft); }

.score-right {
  display: flex;
  align-items: center;
  gap: 1.5rem;
}
.gauge-wrap {
  display: flex;
  align-items: center;
  gap: .7rem;
}
.gauge-meta { line-height: 1.25; }
.gauge-title { font-size: .74rem; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.gauge-sub { font-size: .84rem; font-weight: 600; color: var(--text); margin-top: .12rem; }
.mini-stat {
  border-left: 1px solid var(--border);
  padding-left: 1.15rem;
  line-height: 1.25;
}
.mini-stat-val { font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em; }
.mini-stat-lbl { font-size: .73rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: .15rem; }

/* Canvas Cards */
.canvas-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.15rem 1.3rem 1rem;
  margin-bottom: 1rem;
}
.canvas-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: .4rem 1rem;
  margin-bottom: .55rem;
}
.canvas-title {
  font-size: .92rem;
  font-weight: 650;
  margin: 0;
  letter-spacing: -.01em;
}
.canvas-meta {
  font-size: .78rem;
  color: var(--muted);
}
.canvas-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(430px, 1fr));
  gap: 1rem;
  margin-bottom: 1rem;
}
.canvas-grid > .canvas-card { margin-bottom: 0; }
.canvas-grid > :only-child .chart-svg { max-width: 560px; margin: 0 auto; }
@media (max-width: 560px) {
  .canvas-grid { grid-template-columns: 1fr; }
}
.chart-svg {
  width: 100%;
  height: auto;
  display: block;
  overflow: visible;
}

/* SVG Semantic Classes */
.svg-grid { stroke: var(--grid); stroke-width: 1; }
.svg-axis { stroke: var(--border-strong); stroke-width: 1.3; }
.svg-thresh { stroke: var(--promising); stroke-width: 1.4; stroke-dasharray: 5 4; }
.svg-thresh-warn { stroke: var(--warn); stroke-width: 1.4; stroke-dasharray: 5 4; }
.svg-text { fill: var(--text); font-size: 11.5px; font-weight: 500; font-family: inherit; }
.svg-bold { fill: var(--text); font-size: 12px; font-weight: 700; font-family: inherit; }
.svg-muted { fill: var(--muted); font-size: 10.5px; font-family: inherit; }
.svg-mono { fill: var(--text); font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.svg-band-pass { fill: var(--pass); opacity: .09; }
.svg-band-neutral { fill: var(--neutral); opacity: .08; }
.svg-area-pass { fill: var(--pass); opacity: .11; }
.svg-slope-pass { stroke: var(--pass); stroke-width: 2.3; fill: none; opacity: .85; }
.svg-slope-warn { stroke: var(--warn); stroke-width: 2.3; fill: none; opacity: .88; }
.svg-slope-fail { stroke: var(--fail); stroke-width: 2.3; fill: none; opacity: .88; }
.svg-line-pass { stroke: var(--pass); stroke-width: 2.6; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.svg-dot-seed { fill: var(--surface); stroke: var(--neutral); stroke-width: 2.2; }
.svg-dot-pass { fill: var(--pass); stroke: var(--surface); stroke-width: 2; }
.svg-dot-warn { fill: var(--warn); stroke: var(--surface); stroke-width: 2; }
.svg-dot-fail { fill: var(--fail); stroke: var(--surface); stroke-width: 2; }
.svg-dot-discard { fill: var(--faint); opacity: .75; }
.svg-bar-pass { fill: var(--pass); }
.svg-bar-warn { fill: var(--warn); }
.svg-bar-fail { fill: var(--fail); }
.svg-bar-elephant { fill: var(--elephant); }
.svg-bar-goldfish { fill: var(--goldfish); }

/* Chip Footer Strip */
.chip-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .5rem .65rem;
  padding-top: .35rem;
  font-size: .8rem;
  color: var(--muted);
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .22rem .6rem;
  border-radius: 7px;
  background: var(--surface);
  border: 1px solid var(--border);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: .77rem;
  color: var(--text);
}

/* Tab 2: Flow & Hypothesis (EGM Editorial Sheet Style) */
.egm-sheet {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 1.6rem 1.75rem;
  margin-bottom: 1rem;
}
.egm-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem;
  margin-top: 1.2rem;
  padding-top: 1.2rem;
  border-top: 1px solid var(--border);
}
.egm-num {
  font-size: .78rem;
  font-weight: 700;
  color: var(--goldfish);
  margin-bottom: .25rem;
}
.egm-item h3 { font-size: .95rem; margin: 0 0 .35rem; }
.egm-item p { font-size: .88rem; color: var(--muted); margin: 0; overflow-wrap: anywhere; }

/* Tab 3: Forensic Audit Sections */
.provenance-line {
  font-size: .75rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--muted);
  margin: 0 0 1rem;
  overflow-wrap: anywhere;
}
section.report-section {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.05rem 1.25rem;
  margin-bottom: .8rem;
}
section.report-section h2 { font-size: 1rem; margin: 0 0 .5rem; }
section.report-section p { max-width: 92ch; margin: .4rem 0; font-size: .88rem; color: var(--muted); overflow-wrap: anywhere; }
details { margin-top: .55rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-low); padding: .45rem .7rem; }
summary { cursor: pointer; font-weight: 600; font-size: .83rem; }
.table-wrap { overflow-x: auto; margin-top: .55rem; }
table { border-collapse: collapse; width: 100%; font-size: .82rem; }
th, td { text-align: left; vertical-align: middle; padding: .5rem .6rem; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
th { font-size: .73rem; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--surface-low); }
tbody tr:last-child td { border-bottom: none; }
.pill { display: inline-block; padding: .1rem .45rem; border-radius: 999px; font-size: .74rem; font-weight: 650; background: var(--neutral-soft); color: var(--neutral); white-space: nowrap; }
.pill.tone-pass { color: var(--pass); background: var(--pass-soft); }
.pill.tone-promising { color: var(--promising); background: var(--promising-soft); }
.pill.tone-warn { color: var(--warn); background: var(--warn-soft); }
.pill.tone-fail { color: var(--fail); background: var(--fail-soft); }
code.hash {
  display: inline-block; max-width: 12ch; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; vertical-align: bottom; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .77rem; padding: .06rem .32rem; border-radius: 4px; background: var(--surface-low);
}
@media print {
  body { background: #fff; padding: 0; max-width: none; }
  .tab-nav { display: none; }
  .view-panel { display: block !important; margin-bottom: 1.5rem; }
  code.hash { max-width: none; white-space: normal; }
}
</style>
</head>
<body>
<input class="view-radio" type="radio" name="report-view" id="tab-overview" checked>
<input class="view-radio" type="radio" name="report-view" id="tab-flow">
<input class="view-radio" type="radio" name="report-view" id="tab-audit">
<header class="topbar">
  <div class="brand">
    <span class="brand-title">Improvement report</span>
  </div>
  <nav class="tab-nav" aria-label="Report views">
    <label class="tab-label" for="tab-overview">Visual Overview</label>
    <label class="tab-label" for="tab-flow">Hypothesis &amp; Flow</label>
    <label class="tab-label" for="tab-audit">Audit Trail</label>
  </nav>
</header>
<main>
{{content}}
</main>
<footer style="margin-top:2rem;padding-top:.9rem;border-top:1px solid var(--border)">
  <p class="provenance-line">{{provenance}}</p>
</footer>
</body>
</html>
