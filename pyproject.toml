[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optimizer"
version = "0.1.0"
description = "Run Driveline autoresearch on hypotheses from an EGM-reviewed design"
requires-python = ">=3.12"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
dependencies = []

[project.urls]
Repository = "https://github.com/vedatonuryilmaz/dev_optimizer"

[project.scripts]
optimizer = "scripts.optimizer_worker:main"

[dependency-groups]
dev = ["pytest>=8,<10", "hatchling"]

[tool.hatch.build]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
only-include = ["pyproject.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "scripts", "plugins", "resources", "vendor"]
exclude = ["**/__pycache__", "**/.pytest_cache", "**/.DS_Store"]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
exclude = ["**/__pycache__", "**/.pytest_cache", "**/.DS_Store"]

[tool.hatch.build.targets.wheel.force-include]
"plugins" = "plugins"
"resources" = "resources"
"vendor/driveline-autoresearch" = "vendor/driveline-autoresearch"
"vendor/elephant-goldfish-model" = "vendor/elephant-goldfish-model"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
